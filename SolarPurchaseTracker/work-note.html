<!DOCTYPE html>
<html lang="en" class="work-note-page">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Note — Solar Purchase Tracker</title>
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/installments.css">
<script src="js/auth.js"></script>
<style>
  .cust-list-container {
    max-height: 160px;
    overflow-y: auto;
    border: 1px solid var(--st-border);
    border-radius: var(--st-radius);
    padding: 4px 8px;
    background: #ffffff;
  }
  .cust-item-row {
    min-height: 28px;
    border-radius: var(--st-radius);
    transition: background-color 0.12s ease;
  }
  .cust-item-row:hover {
    background-color: var(--st-surface-hover);
  }

  .editable-cell-input {
    border: 1px solid var(--st-border);
    border-radius: var(--st-radius);
    padding: 3px 6px;
    font-size: 0.8rem;
    width: 100%;
    min-width: 70px;
    height: 26px;
    background-color: #ffffff;
    transition: border-color 0.12s ease;
  }
  .editable-cell-input:focus {
    border-color: var(--st-primary);
    outline: none;
    box-shadow: 0 0 0 2px rgba(67, 56, 202, 0.15);
  }

  .saved-note-card {
    background: #ffffff;
    border: 1px solid var(--st-border);
    border-radius: var(--st-card-radius);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    padding: 12px 14px;
    position: relative;
  }
  .saved-note-card:hover {
    border-color: #cbd5e1;
    box-shadow: var(--st-shadow-sm);
  }

  /* Table styling */
  #workNoteTable, #modalWorkNoteTable {
    font-size: 0.78rem;
    border-collapse: separate;
    border-spacing: 0;
  }
  #workNoteTable th, #modalWorkNoteTable th {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 6px 8px;
    background-color: #f8fafc;
    border-bottom: 1px solid var(--st-border);
    color: var(--st-text-secondary);
    white-space: nowrap;
  }
  #workNoteTable td, #modalWorkNoteTable td {
    padding: 4px 6px;
    border-bottom: 1px solid var(--st-border);
    vertical-align: middle;
  }
  #workNoteTable .editable-cell-input, #modalWorkNoteTable .editable-cell-input {
    font-size: 0.78rem;
    height: 24px;
    padding: 2px 5px;
  }
</style>
</head>
<body class="work-note-page">

<div class="app-shell">
  <div id="sidebar"></div>

  <div class="main-content">
    <div class="topbar" id="topbar"></div>

    <div class="page-body">
      <!-- 1. Search & Filter Toolbar -->
      <div class="erp-toolbar no-print">
        <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap mb-2">
          <div class="d-flex align-items-center gap-2 cursor-pointer" data-bs-toggle="collapse" data-bs-target="#searchCollapse" aria-expanded="true" aria-controls="searchCollapse">
            <span class="fw-bold text-dark fs-7">Search &amp; Filters</span>
            <span class="text-muted small" id="searchCollapseIndicator">▲ Hide</span>
          </div>
          <div id="districtStatsContainer" class="d-flex flex-wrap gap-1 align-items-center ms-auto"></div>
        </div>
        <div class="collapse show" id="searchCollapse">
          <div class="pt-1">
            <div class="row g-2 align-items-end">
              <div class="col-12 col-sm-6 col-md-3">
                <label class="form-label text-muted small fw-semibold mb-1">Search</label>
                <input type="text" class="form-control form-control-sm" id="fSearch" placeholder="Name, Mobile, Consumer No...">
              </div>
              <div class="col-12 col-sm-6 col-md-2">
                <label class="form-label text-muted small fw-semibold mb-1">Partner</label>
                <div class="dropdown">
                  <button class="btn btn-outline-secondary btn-sm w-100 dropdown-toggle text-start text-truncate" type="button" id="btnPartnerMultiselect" data-bs-toggle="dropdown" data-bs-auto-close="outside">
                    All Partners
                  </button>
                  <div class="dropdown-menu p-2" id="partnerMultiselectMenu" style="max-height: 180px; overflow-y: auto; min-width: 180px; font-size: 0.8rem;">
                    <!-- Checkboxes injected by js -->
                  </div>
                </div>
              </div>
              <div class="col-12 col-sm-6 col-md-2">
                <label class="form-label text-muted small fw-semibold mb-1">Date Type</label>
                <select class="form-select form-select-sm" id="fDateType">
                  <option value="LoginDate" selected>Login Date</option>
                  <option value="InstallationDate">Installation Date</option>
                  <option value="CommissioningDate">Commissioning Date</option>
                </select>
              </div>
              <div class="col-6 col-sm-3 col-md-2">
                <label class="form-label text-muted small fw-semibold mb-1">From Date</label>
                <input type="date" class="form-control form-control-sm" id="fLoginFrom">
              </div>
              <div class="col-6 col-sm-3 col-md-2">
                <label class="form-label text-muted small fw-semibold mb-1">To Date</label>
                <input type="date" class="form-control form-control-sm" id="fLoginTo">
              </div>
              <div class="col-auto d-flex align-items-center mb-1">
                <div class="form-check mb-0">
                  <input class="form-check-input" type="checkbox" id="chkShowDeactive">
                  <label class="form-check-label text-secondary small fw-semibold ms-1" for="chkShowDeactive">Show Deactive</label>
                </div>
              </div>
              <div class="col-auto">
                <button class="btn btn-outline-secondary btn-sm" id="btnClearFilters">Clear</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-3">
        <!-- Left Column: Customer Selection & Columns -->
        <div class="col-lg-5 col-xl-4">
          <!-- 2. Customer Selection Section -->
          <div class="st-card mb-3">
            <div class="d-flex justify-content-between align-items-center mb-2 pb-1 border-bottom">
              <span class="fw-bold text-dark fs-7">Select Customers</span>
              <div class="d-flex align-items-center gap-1">
                <input class="form-check-input m-0 cursor-pointer" type="checkbox" id="chkSelectAllCustomers">
                <label class="form-check-label fw-semibold text-primary ms-1 cursor-pointer small" for="chkSelectAllCustomers" id="lblSelectAll">Select All</label>
              </div>
            </div>
            <div class="cust-list-container" id="customerSelectionContainer">
              <!-- Checkbox list injected dynamically -->
            </div>
            <div class="text-secondary mt-1 fw-semibold small" id="selectedCustomerCountLabel">0 selected</div>
          </div>

          <!-- 3. Badges Selection Section -->
          <div class="st-card mb-3">
            <div class="fw-bold text-dark fs-7 mb-2 pb-1 border-bottom">Select Columns</div>
            <div class="d-flex flex-wrap gap-1.5" id="badgesContainer">
              <!-- Badges injected dynamically by JS -->
            </div>
          </div>

          <!-- 4. Note Title & Common Remarks -->
          <div class="st-card">
            <div class="fw-bold text-dark fs-7 mb-2 pb-1 border-bottom">Work Note Details</div>
            <div class="mb-2">
              <label class="form-label text-muted small fw-semibold mb-1">Work Note Title *</label>
              <input type="text" class="form-control form-control-sm" id="txtNoteTitle" placeholder="e.g. August Net Metering Sheet">
              <input type="hidden" id="txtNoteID">
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small fw-semibold mb-1">Common Remarks</label>
              <textarea class="form-control form-control-sm" id="txtCommonNote" rows="2" placeholder="Enter batch remarks or instructions..."></textarea>
            </div>
            <div class="d-flex justify-content-end gap-2">
              <button class="btn btn-outline-secondary btn-sm" id="btnCancelEdit" style="display:none;" onclick="resetWorkNoteEditor()">Cancel</button>
              <button class="btn btn-primary btn-sm px-3 fw-semibold" id="btnSaveWorkNote">Save Work Note</button>
            </div>
          </div>
        </div>

        <!-- Right Column: Dynamic Table & Saved Notes -->
        <div class="col-lg-7 col-xl-8">
          <!-- 5. Dynamic Work Note Table Builder -->
          <div class="st-card mb-3" id="tableCard" style="display:none;">
            <div class="d-flex justify-content-between align-items-center mb-2 pb-1 border-bottom">
              <span class="fw-bold text-dark fs-7">Work Note Table</span>
              <span class="text-secondary fw-semibold small" id="tableRowCountLabel">0 rows</span>
            </div>
            <div class="table-responsive" style="max-height: 280px; overflow-y: auto;">
              <table class="table table-hover align-middle mb-0" id="workNoteTable">
                <thead>
                  <tr id="workNoteTheadRow">
                    <!-- Headers injected dynamically -->
                  </tr>
                </thead>
                <tbody id="workNoteTbody">
                  <!-- Rows injected dynamically -->
                </tbody>
              </table>
            </div>
          </div>

          <!-- 6. Saved Work Notes List -->
          <div class="st-card">
            <div class="d-flex justify-content-between align-items-center mb-2 pb-1 border-bottom flex-wrap gap-2">
              <span class="fw-bold text-dark fs-7">Saved Work Notes</span>
              <div style="width: 100%; max-width: 220px;">
                <input type="text" class="form-control form-control-sm" id="fSavedNoteSearch" placeholder="Search saved notes...">
              </div>
            </div>
            <div class="row g-2" id="savedNotesContainer">
              <!-- Saved notes cards injected dynamically -->
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal for Custom Column Name Input -->
<div class="modal fade" id="customColumnModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title fw-bold" id="customColModalTitle">Add Custom Column</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <label class="form-label text-muted small fw-semibold mb-1">Column Title *</label>
        <input type="text" class="form-control form-control-sm" id="txtCustomColName" placeholder="e.g. Inspection Date">
        <input type="hidden" id="hdnCustomColType" value="text">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary btn-sm" id="btnConfirmAddCustomCol">Add Column</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal for Viewing Saved Work Note Details in Popup -->
<div class="modal fade" id="viewNoteModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title fw-bold text-primary" id="viewNoteModalTitle">Work Note Details</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="viewNoteModalBody">
        <!-- Injected dynamically -->
      </div>
      <div class="modal-footer d-flex justify-content-between flex-wrap gap-2">
        <span class="text-secondary small" id="viewNoteModalMeta"></span>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary btn-sm fw-semibold" id="btnUpdateSavedNoteFromModal">Save Changes</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/bootstrap.bundle.min.js" defer></script>
<script src="js/db.js" defer></script>
<script src="js/calc.js" defer></script>
<script src="js/validation.js" defer></script>
<script src="js/utils.js" defer></script>
<script src="js/ui.js?v=1.0.1" defer></script>
<script src="js/connect.js" defer></script>
<script src="js/work-note.js?v=1.0.1" defer></script>
</body>
</html>
