<!DOCTYPE html>
<html lang="en" class="summary-page">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summary — SolarTrack</title>
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/customer.css">
<link rel="stylesheet" href="css/manage-work.css">
<link rel="stylesheet" href="css/summary.css">
<script src="js/auth.js"></script>
</head>
<body class="summary-page">

<div class="app-shell">
  <div id="sidebar"></div>

  <div class="main-content">
    <div class="topbar" id="topbar"></div>

    <div class="page-body">
      <!-- Page Navigation Tabs: Summary & Activity -->
      <ul class="nav nav-tabs erp-tabs mb-2.5" id="summaryPageTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active fw-semibold fs-8 d-inline-flex align-items-center gap-1.5" id="tabSummaryBtn" data-bs-toggle="tab" data-bs-target="#tabSummaryPane" type="button" role="tab" aria-controls="tabSummaryPane" aria-selected="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span>Summary</span>
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link fw-semibold fs-8 d-inline-flex align-items-center gap-1.5" id="tabActivityBtn" data-bs-toggle="tab" data-bs-target="#tabActivityPane" type="button" role="tab" aria-controls="tabActivityPane" aria-selected="false">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            <span>Activity</span>
          </button>
        </li>
      </ul>

      <div class="tab-content" id="summaryPageTabContent">
        <!-- ══ TAB 1: Work Financial & Delivery Summary ══════════════════ -->
        <div class="tab-pane fade show active" id="tabSummaryPane" role="tabpanel" aria-labelledby="tabSummaryBtn">
          <!-- Filters Toolbar: Replicating Manage Work (Search, Partner Multiselect, District Badges, Stage Badges, Payment Badges) -->
          <div class="st-card erp-toolbar mb-2 py-2 px-3 border rounded-2 bg-light mw-summary-filter-toolbar">
            <!-- Row 1: Search, Partner Multiselect Dropdown, Clear Filters -->
            <div class="mw-toolbar-top-row d-flex justify-content-between align-items-center gap-2 flex-wrap mb-1.5">
              <div class="mw-search-box flex-grow-1" style="max-width: 420px; min-width: 200px;">
                <div class="input-group input-group-sm">
                  <span class="input-group-text bg-white border-end-0 text-muted ps-2.5 pe-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                  </span>
                  <input type="text" class="form-control border-start-0 ps-1 bg-white fs-8" id="fSumModalSearch" placeholder="Search customer, mobile, address, brand..." style="font-size:0.83rem;">
                </div>
              </div>
              <div class="mw-toolbar-actions d-flex align-items-center gap-2 flex-wrap ms-auto">
                <!-- Partner Multi-select Dropdown (Identical to Manage Work) -->
                <div class="dropdown" style="min-width: 140px; max-width: 180px;">
                  <button class="btn btn-sm btn-outline-secondary w-100 dropdown-toggle text-start text-truncate bg-white fs-8 py-1 px-2 shadow-none" type="button" id="btnSumPartnerMultiselect" data-bs-toggle="dropdown" data-bs-auto-close="outside">
                    All Partners
                  </button>
                  <div class="dropdown-menu p-3 shadow-sm border" id="sumPartnerMultiselectMenu" style="max-height: 250px; overflow-y: auto; min-width: 220px; font-size:0.82rem;">
                    <!-- Checkboxes injected by JS -->
                  </div>
                </div>

                <button class="btn btn-sm btn-link text-muted text-decoration-none py-1 px-1.5 fs-8" id="btnSumClearFilters">Clear</button>
              </div>
            </div>

            <!-- Row 2: Area / District Badges (Horizontal Scrollable Strip) -->
            <div class="mw-chips-scroll-strip mw-district-strip mb-1.5" id="sumDistrictStatsContainer"></div>

            <!-- Row 3: Status / Stage Filters (Login, Agreement, Subsidy) (Horizontal Scrollable Strip) -->
            <div class="mw-chips-scroll-strip mw-stage-strip mb-1.5" id="sumStageStatsContainer"></div>

            <!-- Row 4: Customer Payment Filters (Horizontal Scrollable Strip) -->
            <div class="mw-chips-scroll-strip mw-payment-strip" id="sumPaymentStatsContainer"></div>
          </div>

          <!-- Table Top Action Bar: Exclude Button, Select Columns Dropdown, Copy Button -->
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 px-1 mb-2">
            <div class="d-flex align-items-center gap-2">
              <span class="badge bg-white text-secondary border fs-8 fw-semibold px-2.5 py-1" id="sumModalRowCount">0 customers</span>
              
              <!-- Exclude from Summary Button (shown when checkbox selected) -->
              <button type="button" class="btn btn-sm btn-danger d-none align-items-center gap-1.5 py-1 px-2.5 shadow-sm fs-8" id="btnExcludeFromSummary" title="Remove selected customers from summary view">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                <span>Exclude from Summary (<strong id="excludeCount">0</strong>)</span>
              </button>

              <!-- Excluded Dropdown Button (shown if any customer is excluded) -->
              <div class="dropdown d-none" id="excludedDropdownWrap">
                <button type="button" class="btn btn-sm btn-outline-danger dropdown-toggle d-inline-flex align-items-center gap-1.5 py-1 px-2.5 fs-8 shadow-sm" id="btnExcludedList" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" title="Click to view and remove excluded customers">
                  <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
                  <span>Excluded (<strong id="excludedCount">0</strong>)</span>
                </button>
                <div class="dropdown-menu p-2.5 shadow-lg border" id="excludedListMenu" style="min-width: 320px; max-width: 420px; max-height: 380px; overflow-y: auto; font-size: 0.82rem; z-index: 1070;">
                  <div class="d-flex justify-content-between align-items-center mb-2 pb-1.5 border-bottom px-1">
                    <span class="fw-bold text-dark fs-8">Excluded Customers (<span id="excludedMenuHeaderCount">0</span>)</span>
                    <button type="button" class="btn btn-link btn-xs p-0 text-decoration-none text-danger fs-8 fw-semibold" id="btnRestoreAllExcluded">Restore All</button>
                  </div>
                  <div class="d-flex flex-column gap-1.5" id="excludedCustomersList">
                    <!-- Excluded customer items rendered here -->
                  </div>
                </div>
              </div>
            </div>

            <!-- Separate Select Columns Dropdown & Standalone Copy Button -->
            <div class="d-flex align-items-center gap-2">
              <!-- Select Columns Dropdown Button -->
              <div class="dropdown">
                <button class="btn btn-sm btn-outline-secondary dropdown-toggle d-inline-flex align-items-center gap-1.5 py-1 px-2.5 bg-white shadow-none fs-8" type="button" id="btnSelectColumnsDropdown" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                  <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
                  <span>Select Columns</span>
                </button>
                <div class="dropdown-menu dropdown-menu-end p-3 shadow-lg border" id="summaryColumnsMenu" style="min-width: 250px; max-height: 440px; overflow-y: auto; font-size: 0.82rem;">
                  <div class="d-flex justify-content-between align-items-center mb-2 pb-1 border-bottom">
                    <span class="fw-bold text-dark fs-8">Columns to Include</span>
                    <div class="d-flex gap-1.5">
                      <button type="button" class="btn btn-link btn-xs p-0 text-decoration-none fs-9" id="btnSelectAllCols">All</button>
                      <span class="text-muted fs-9">|</span>
                      <button type="button" class="btn btn-link btn-xs p-0 text-decoration-none text-muted fs-9" id="btnResetDefaultCols">Default</button>
                      <span class="text-muted fs-9">|</span>
                      <button type="button" class="btn btn-link btn-xs p-0 text-decoration-none text-muted fs-9" id="btnDeselectAllCols">None</button>
                    </div>
                  </div>
                  <div class="d-flex flex-column gap-1.5" id="summaryColsChecklist">
                    <!-- Checkboxes populated dynamically (default checked: customer, payment, install, meter) -->
                  </div>
                </div>
              </div>

              <!-- Standalone Copy Button (Copy) -->
              <button type="button" class="btn btn-sm btn-primary d-inline-flex align-items-center gap-1.5 py-1 px-3 shadow-sm fs-8" id="btnCopySummary" title="Copy formatted for Notepad / WhatsApp">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                <span>Copy</span>
              </button>
            </div>
          </div>

          <!-- Customer Workflow Financial & Delivery Table -->
          <div class="card border rounded-2 bg-white shadow-sm summary-table-card mw-summary-table-card">
            <div class="table-responsive p-0 mw-summary-table-wrap">
              <table class="table table-sm table-hover table-bordered align-middle mb-0 table-manage-work-summary" id="workSummaryTable">
                <thead class="table-light">
                  <tr>
                    <th class="th-col-customer">
                      <div class="d-flex align-items-center gap-2">
                        <input type="checkbox" class="form-check-input mt-0" id="chkSumSelectAll" title="Select / Deselect all visible customers">
                        <span>Customer: Status</span>
                      </div>
                    </th>
                    <th class="th-col-pvmodule text-nowrap">PVModule Make</th>
                    <th class="th-col-inverter text-nowrap">Inverter Make</th>
                    <th class="th-col-payment text-nowrap">Payment</th>
                    <th class="th-col-install text-end text-nowrap">Install</th>
                    <th class="th-col-meter text-end text-nowrap">Meter</th>
                    <th class="th-col-delivery text-end text-nowrap">Delivery</th>
                    <th class="th-col-others text-end text-nowrap">Others</th>
                    <th class="th-col-comment">Comment</th>
                    <th class="th-col-material text-end text-nowrap">Material</th>
                    <th class="th-col-setcost text-end text-nowrap bg-light-subtle">Set Cost</th>
                    <th class="th-col-profit text-end text-nowrap bg-light-subtle">Profit</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- Injected dynamically by JS -->
                </tbody>
                <tfoot class="table-light fw-bold" id="workSummaryTableFoot">
                  <!-- Injected dynamically by JS -->
                </tfoot>
              </table>
            </div>
          </div>
        </div>

        <!-- ══ TAB 2: Activity Tab ══════════════════════════════════════ -->
        <div class="tab-pane fade" id="tabActivityPane" role="tabpanel" aria-labelledby="tabActivityBtn">
          <!-- Activity Filter Toolbar -->
          <div class="st-card erp-toolbar mb-2 py-2 px-3 border rounded-2 bg-light">
            <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap mb-1.5">
              <div class="mw-search-box flex-grow-1" style="max-width: 420px; min-width: 200px;">
                <div class="input-group input-group-sm">
                  <span class="input-group-text bg-white border-end-0 text-muted ps-2.5 pe-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                  </span>
                  <input type="text" class="form-control border-start-0 ps-1 bg-white fs-8" id="fActivitySearch" placeholder="Search activity, customer, action, date..." style="font-size:0.83rem;">
                </div>
              </div>
              <div class="d-flex align-items-center gap-1.5" id="activityCategoryFilter">
                <button type="button" class="btn btn-xs btn-outline-secondary active" data-act-filter="ALL">All</button>
                <button type="button" class="btn btn-xs btn-outline-secondary" data-act-filter="Status">Stage Status</button>
                <button type="button" class="btn btn-xs btn-outline-secondary" data-act-filter="Payment">Payments</button>
                <button type="button" class="btn btn-xs btn-outline-secondary" data-act-filter="Dispatch">Dispatches</button>
              </div>
            </div>
          </div>

          <!-- Activity Timeline Feed -->
          <div class="card border rounded-2 bg-white shadow-sm p-3">
            <div class="d-flex justify-content-between align-items-center mb-2.5 pb-2 border-bottom">
              <h6 class="fw-bold fs-7 text-dark mb-0 d-flex align-items-center gap-1.5">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                <span>Recent System Activities</span>
              </h6>
              <span class="badge bg-light text-muted border fs-9" id="activityCountBadge">0 activities</span>
            </div>
            <div id="activityTimelineContainer" class="activity-timeline">
              <!-- Dynamically populated activities -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="js/db.js"></script>
<script src="js/calc.js"></script>
<script src="js/validation.js"></script>
<script src="js/utils.js"></script>
<script src="js/ui.js"></script>
<script src="js/connect.js"></script>
<script src="js/summary.js"></script>
</body>
</html>
