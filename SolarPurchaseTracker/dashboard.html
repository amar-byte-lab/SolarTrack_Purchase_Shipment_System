<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Solar Purchase Tracker</title>
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/manage-work.css">
<link rel="stylesheet" href="css/dashboard.css">
<script src="js/auth.js"></script>
</head>
<body class="dashboard-page">

<div class="app-shell">
  <div id="sidebar"></div>

  <div class="main-content">
    <div class="topbar" id="topbar"></div>

    <div class="page-body">

      <!-- ══ Search & Filters Toolbar (Exact same as Customer / Manage Work) ══ -->
      <div class="st-card erp-toolbar mb-2 no-print py-2 px-3">
        <!-- Row 1: Search and Main Action Controls -->
        <div class="mw-toolbar-top-row d-flex justify-content-between align-items-center gap-2 flex-wrap mb-1.5">
          <div class="mw-search-box flex-grow-1" style="max-width: 420px; min-width: 200px;">
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-white border-end-0 text-muted ps-2.5 pe-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </span>
              <input type="text" class="form-control border-start-0 ps-1" id="fDashSearch" placeholder="Search customer, mobile, address, brand..." style="font-size:0.83rem;">
            </div>
          </div>
          <div class="mw-toolbar-actions d-flex align-items-center gap-2 flex-wrap ms-auto">
            <!-- Partner Filter Multiselect Dropdown -->
            <div class="dropdown" style="min-width: 130px; max-width: 170px;">
              <button class="btn btn-sm btn-outline-secondary w-100 dropdown-toggle text-start text-truncate bg-white fs-8 py-1 px-2 shadow-none" type="button" id="btnDashPartnerMultiselect" data-bs-toggle="dropdown" data-bs-auto-close="outside">
                <span id="txtDashPartnerLabel" class="text-truncate">All Partners</span>
              </button>
              <div class="dropdown-menu p-3 shadow-sm border" id="dashPartnerMultiselectMenu" style="max-height: 250px; overflow-y: auto; min-width: 220px; font-size:0.82rem;">
                <!-- Checkboxes injected by js -->
              </div>
            </div>

            <!-- Show Deactive Checkbox -->
            <div class="form-check mb-0 d-flex align-items-center gap-1">
              <input class="form-check-input mt-0" type="checkbox" id="chkDashShowDeactive">
              <label class="form-check-label fs-8 text-secondary cursor-pointer text-nowrap" for="chkDashShowDeactive">Show Deactive</label>
            </div>

            <button class="btn btn-sm btn-link text-muted text-decoration-none py-1 px-1.5 fs-8" id="btnClearDashFilters">Clear</button>
          </div>
        </div>

        <!-- Row 2: Location / District Badges (Horizontal Scrollable Strip on Mobile) -->
        <div class="mw-chips-scroll-strip mw-district-strip" id="dashDistrictStatsContainer"></div>
      </div>

      <!-- ══ Stage Completion KPI Grid ═══════════════════════════════════ -->
      <div class="mw-kpi-grid mb-2.5" id="dashWorkKpiGrid">
        <!-- Injected dynamically by dashboard.js -->
      </div>

      <!-- ══ Full Page Customer Workflow Progress Table Card ═════════════ -->
      <div class="card border rounded-3 bg-white shadow-sm overflow-hidden dash-summary-card">
        <div class="card-header py-2 px-3 bg-light border-bottom d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div class="d-flex align-items-center gap-2">
            <span class="badge bg-white text-secondary border fs-8 fw-normal" id="dashSumRowCount">Loading customers...</span>
            <button type="button" class="btn btn-sm btn-link text-decoration-none text-primary p-0 fs-8 fw-semibold" id="btnResetDashKpiFilter" style="display: none;">
              Show All Stages
            </button>
          </div>
          <div class="d-flex align-items-center gap-2 ms-auto" id="dashManageWorkBtnWrap" style="display: none !important;">
            <a href="manage-work.html" class="btn btn-sm btn-outline-primary fs-8 d-inline-flex align-items-center gap-1 py-1 px-2.5" id="btnDashManageWork">
              <i class="bi bi-box-arrow-up-right"></i> <span>Manage Work</span>
            </a>
          </div>
        </div>
        <div class="table-responsive p-0 dash-summary-table-wrap">
          <table class="table table-sm table-hover align-middle mb-0 table-manage-work-summary" id="dashWorkSummaryTable">
            <thead class="table-light sticky-top" style="z-index: 2;">
              <tr>
                <th class="text-center th-col-sl">#</th>
                <th class="th-col-cust">Customer</th>
                <th class="th-col-partner sortable" id="thDashPartner" title="Click to sort by Partner name">
                  Partner <i class="bi bi-arrow-down-up fs-9 ms-0.5 opacity-50" id="sortIconDashPartner"></i>
                </th>
                <th class="text-center th-stage-col sortable" id="thDashLogin" title="Click to sort by Login alert priority (Red -> Yellow -> Blue)">
                  1. LOGIN <i class="bi bi-arrow-down-up fs-9 ms-0.5 opacity-50" id="sortIconDashLogin"></i>
                </th>
                <th class="text-center th-stage-col sortable" id="thDashAgreement" title="Click to sort by Agreement alert priority (Red -> Yellow -> Blue)">
                  2. AGRMT <i class="bi bi-arrow-down-up fs-9 ms-0.5 opacity-50" id="sortIconDashAgreement"></i>
                </th>
                <th class="text-center th-stage-col">3. DISPATCH</th>
                <th class="text-center th-stage-col">4. INSTALL</th>
                <th class="text-center th-stage-col">5. NETMETER</th>
                <th class="text-center th-stage-col">6. INSPECT</th>
                <th class="text-center th-stage-col">7. CONNECT</th>
                <th class="text-center th-stage-col">8. SUBSIDY</th>
              </tr>
            </thead>
            <tbody>
              <!-- Injected dynamically by dashboard.js -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ══ Customer Details Popup Modal ══════════════════════════════════════ -->
<div class="modal fade" id="customerDetailsModal" tabindex="-1" aria-labelledby="customerDetailsModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content border shadow-sm rounded-2">
      <div class="modal-header py-2.5 px-3 border-bottom bg-light">
        <div class="d-flex align-items-center gap-2">
          <span class="badge bg-primary fs-7" id="cdModalSlNo">#1</span>
          <h6 class="modal-title fw-bold fs-6 text-dark mb-0" id="cdModalTitle">Customer Details</h6>
          <span class="badge bg-success ms-1" id="cdModalStatus">Active</span>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-3 d-flex flex-column gap-3" id="cdModalBody">
        <!-- Injected dynamically by JS -->
      </div>
      <div class="modal-footer bg-light py-2 px-3">
        <button type="button" class="btn btn-sm btn-secondary px-3" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/bootstrap.bundle.min.js" defer></script>
<script src="assets/js/xlsx.full.min.js" defer></script>
<script src="js/db.js" defer></script>
<script src="js/calc.js" defer></script>
<script src="js/validation.js" defer></script>
<script src="js/utils.js" defer></script>
<script src="js/ui.js?v=1.0.3" defer></script>
<script src="js/connect.js" defer></script>
<script src="js/dashboard.js?v=1.0.1" defer></script>
</body>
</html>
