<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — Solar Purchase Tracker</title>
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/master.css">
<script src="js/auth.js"></script>
</head>
<body>

<div class="app-shell">
  <div id="sidebar"></div>
  <div class="main-content">
    <div class="topbar" id="topbar"></div>
    <div class="page-body">

      <div class="st-card mb-3 p-3">
        <div class="row g-2 align-items-end">
          <div class="col-md-3">
            <label class="form-label text-muted small fw-semibold">Report Type</label>
            <select class="form-select" id="rType">
              <option value="daily">Daily Purchase Report</option>
              <option value="monthly">Monthly Purchase Report</option>
              <option value="vendor">Vendor Purchase Report</option>
              <option value="item">Item Purchase Report</option>
              <option value="shipment">Shipment Report</option>
              <option value="transport">Transportation Report</option>
              <option value="gst">GST Report</option>
              <option value="costperunit">Cost Per Unit Report</option>
              <option value="inventory">Inventory Purchase Report</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label text-muted small fw-semibold">From Date</label>
            <input type="date" class="form-control" id="rFrom">
          </div>
          <div class="col-md-2">
            <label class="form-label text-muted small fw-semibold">To Date</label>
            <input type="date" class="form-control" id="rTo">
          </div>
          <div class="col-md-2">
            <button class="btn btn-primary w-100" id="btnRun">Generate Report</button>
          </div>
          <div class="col-md-3 d-flex gap-2 justify-content-end">
            <button class="btn btn-outline-secondary btn-sm" id="btnExcel">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-1"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Export Excel
            </button>
            <button class="btn btn-outline-secondary btn-sm" id="btnPDF">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-1"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
              Export PDF
            </button>
          </div>
        </div>
      </div>

      <div class="st-card p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0" id="reportTable">
            <thead><tr id="reportHead"></tr></thead>
            <tbody id="reportBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/xlsx.full.min.js"></script>
<script src="js/db.js"></script>
<script src="js/calc.js"></script>
<script src="js/validation.js"></script>
<script src="js/utils.js"></script>
<script src="js/ui.js"></script>
<script src="js/connect.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
