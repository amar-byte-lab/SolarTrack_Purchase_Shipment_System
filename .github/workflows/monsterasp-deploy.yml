name: Build and Deploy to MonsterASP

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Angular Frontend
        run: |
          cd SolarTrack.Frontend
          npm install --legacy-peer-deps
          npm run build
          cd ..

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish .NET Backend & Bundle Frontend
        run: |
          dotnet publish SolarTrack.Backend/SolarTrack.Backend.csproj -c Release -o ./publish

      - name: Inject MonsterASP Database Connection String
        if: ${{ secrets.MONSTERASP_DB_CONNECTION != '' }}
        run: |
          node -e "
            const fs = require('fs');
            const file = './publish/appsettings.json';
            if (fs.existsSync(file)) {
              const cfg = JSON.parse(fs.readFileSync(file, 'utf8'));
              cfg.ConnectionStrings = cfg.ConnectionStrings || {};
              cfg.ConnectionStrings.DefaultConnection = process.env.DB_CONNECTION;
              fs.writeFileSync(file, JSON.stringify(cfg, null, 2));
              console.log('Successfully injected MonsterASP MS SQL Connection String into appsettings.json');
            }
          "
        env:
          DB_CONNECTION: ${{ secrets.MONSTERASP_DB_CONNECTION }}

      - name: Deploy to MonsterASP via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.MONSTERASP_FTP_SERVER || 'site104851.siteasp.net' }}
          username: ${{ secrets.MONSTERASP_FTP_USERNAME || 'site104851' }}
          password: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ${{ secrets.MONSTERASP_SERVER_DIR || 'wwwroot/' }}
          protocol: ftp
          dangerous-clean-slate: false
