name: Build and Deploy to MonsterASP

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      FTP_SERVER: site104851.siteasp.net
      FTP_USERNAME: site104851
      FTP_SERVER_DIR: wwwroot/

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Angular Frontend
        run: |
          cd SolarTrack.Frontend
          npm install --legacy-peer-deps
          npm run build
          cd ..

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish .NET Backend & Bundle Frontend
        run: |
          dotnet publish SolarTrack.Backend/SolarTrack.Backend.csproj -c Release -o ./publish

      - name: Inject Production Database Connection String
        run: |
          node -e "
            const fs = require('fs');
            const file = './publish/appsettings.Production.json';
            const defaultConn = 'Server=db82007.public.databaseasp.net; Database=db82007; User Id=db82007; Password=g_6K=Bm7W9@z; Encrypt=True; TrustServerCertificate=True; MultipleActiveResultSets=True;';
            const conn = process.env.DB_CONNECTION && process.env.DB_CONNECTION.trim() ? process.env.DB_CONNECTION : defaultConn;
            let cfg = {};
            if (fs.existsSync(file)) {
              try { cfg = JSON.parse(fs.readFileSync(file, 'utf8')); } catch(e) {}
            }
            cfg.ConnectionStrings = cfg.ConnectionStrings || {};
            cfg.ConnectionStrings.DefaultConnection = conn;
            fs.writeFileSync(file, JSON.stringify(cfg, null, 2));
            console.log('Production connection string successfully configured in appsettings.Production.json');
          "
        env:
          DB_CONNECTION: ${{ secrets.MONSTERASP_DB_CONNECTION }}

      - name: Resolve FTP Password
        id: ftp_creds
        run: |
          PASS="${{ secrets.MONSTERASP_FTP_PASSWORD }}"
          if [ -z "$PASS" ]; then
            echo "Using default MonsterASP deployment credentials"
            PASS="E@h4iQ8-G+m6"
          else
            echo "Using repository secret MONSTERASP_FTP_PASSWORD"
          fi
          echo "::add-mask::$PASS"
          echo "password=$PASS" >> "$GITHUB_OUTPUT"

      - name: Deploy to MonsterASP via FTP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -e "set ftp:passive-mode true; set ftp:ssl-allow no; set ftp:use-site-chmod false; set mirror:set-permissions false; set mirror:parallel-transfer-count 8; set net:timeout 60; set net:max-retries 3; mirror -R --parallel=8 --no-perms --only-newer --exclude Logs/ ./publish/ /wwwroot/; quit" -u "$FTP_USER,$FTP_PASS" "$FTP_HOST"
        env:
          FTP_HOST: ${{ env.FTP_SERVER }}
          FTP_USER: ${{ env.FTP_USERNAME }}
          FTP_PASS: ${{ steps.ftp_creds.outputs.password }}
