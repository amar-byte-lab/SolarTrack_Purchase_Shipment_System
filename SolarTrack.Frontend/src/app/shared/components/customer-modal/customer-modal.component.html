<div *ngIf="isOpen" class="modal-backdrop fade show" (click)="onClose()"></div>

<div *ngIf="isOpen" class="modal d-block" tabindex="-1" role="dialog" aria-modal="true" (click)="onClose()">
  <div class="modal-dialog modal-dialog-centered mw-financial-dialog modal-dialog-scrollable" (click)="$event.stopPropagation()">
    <div class="modal-content border-0 shadow-lg rounded-3 overflow-hidden bg-white">
      
      <!-- Modal Header -->
      <div class="modal-header py-2.5 px-3 bg-white border-bottom d-flex align-items-center justify-content-between">
          <div *ngIf="name" class="fw-bold text-dark fs-8 text-uppercase mt-0.5">{{ name }}</div>
        <button type="button" class="btn-close fs-9" aria-label="Close" (click)="onClose()"></button>
      </div>

      <!-- Modal Body (The Editable Financial Form Only) -->
      <div class="modal-body p-3 bg-light-subtle">
        <form (ngSubmit)="saveCustomer()">
          <div class="d-flex flex-column gap-3">

            <!-- Card 1: Revenue & Pricing -->
            <div class="card border rounded-3 bg-white p-3 shadow-xs">
              <div class="d-flex align-items-center gap-2 pb-2 mb-2.5 border-bottom">
                <span class="fw-bold text-dark fs-8 text-uppercase letter-spacing-sm">Revenue &amp; Pricing</span>
              </div>
              <div class="row g-2.5">
                <!-- Customer Price (Turnover) -->
                <div class="col-md-6 col-12">
                  <label class="form-label fs-8 text-secondary mb-1 fw-bold text-dark">Customer Price (₹)</label>
                  <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white px-2 text-muted fw-semibold fs-8">₹</span>
                    <input 
                      type="number" 
                      min="0" 
                      step="any"
                      class="form-control fs-8 font-monospace fw-bold text-dark bg-white" 
                      [(ngModel)]="customerPrice" 
                      name="custCustomerPrice" 
                      placeholder="0.00">
                  </div>
                </div>

                <!-- Partner Price -->
                <div class="col-md-6 col-12">
                  <label class="form-label fs-8 text-secondary mb-1">Partner Price (₹)</label>
                  <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white px-2 text-muted fw-semibold fs-8">₹</span>
                    <input 
                      type="number" 
                      min="0" 
                      step="any"
                      class="form-control fs-8 font-monospace bg-white" 
                      [(ngModel)]="partnerPrice" 
                      name="custPartnerPrice" 
                      placeholder="0.00">
                  </div>
                </div>

                <!-- Billing Price (GST calculated on this) -->
                <div class="col-md-6 col-12">
                  <label class="form-label fs-8 text-secondary mb-1">Billing Price (₹)</label>
                  <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white px-2 text-muted fw-semibold fs-8">₹</span>
                    <input 
                      type="number" 
                      min="0" 
                      step="any"
                      class="form-control fs-8 font-monospace bg-white" 
                      [(ngModel)]="billingPrice" 
                      name="custBillingPrice" 
                      placeholder="0.00">
                  </div>
                </div>

                <!-- Customer Payment -->
                <div class="col-md-6 col-12">
                  <label class="form-label fs-8 text-secondary mb-1">Customer Payment (₹)</label>
                  <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white px-2 text-muted fw-semibold fs-8">₹</span>
                    <input 
                      type="number" 
                      min="0" 
                      step="any"
                      class="form-control fs-8 font-monospace text-success fw-semibold bg-white" 
                      [(ngModel)]="customerPayment" 
                      name="custCustomerPayment" 
                      placeholder="0.00">
                  </div>
                </div>
              </div>
            </div>

            <!-- Card 2: Costs & Expenses -->
            <div class="card border rounded-3 bg-white p-3 shadow-xs">
              <div class="d-flex align-items-center pb-2 mb-2.5 border-bottom">
                <span class="fw-bold text-dark fs-8 text-uppercase letter-spacing-sm">Direct Expenses &amp; Costs</span>
              </div>

              <div class="row g-2.5">
                <!-- Material Cost -->
                <div class="col-md-4 col-sm-6 col-12">
                  <label class="form-label fs-8 text-secondary mb-1">Material Cost (₹)</label>
                  <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white px-2 text-muted fw-semibold fs-8">₹</span>
                    <input 
                      type="number" 
                      min="0" 
                      step="any"
                      class="form-control fs-8 font-monospace bg-white" 
                      [(ngModel)]="materialCost" 
                      name="custMaterialCost" 
                      placeholder="0.00">
                  </div>
                </div>

                <!-- Delivery Cost -->
                <div class="col-md-4 col-sm-6 col-12">
                  <label class="form-label fs-8 text-secondary mb-1">Delivery Cost (₹)</label>
                  <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white px-2 text-muted fw-semibold fs-8">₹</span>
                    <input 
                      type="number" 
                      min="0" 
                      step="any"
                      class="form-control fs-8 font-monospace bg-white" 
                      [(ngModel)]="deliveryCost" 
                      name="custDeliveryCost" 
                      placeholder="0.00">
                  </div>
                </div>

                <!-- Installation Cost -->
                <div class="col-md-4 col-sm-6 col-12">
                  <label class="form-label fs-8 text-secondary mb-1">Installation Cost (₹)</label>
                  <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white px-2 text-muted fw-semibold fs-8">₹</span>
                    <input 
                      type="number" 
                      min="0" 
                      step="any"
                      class="form-control fs-8 font-monospace bg-white" 
                      [(ngModel)]="installationCost" 
                      name="custInstallationCost" 
                      placeholder="0.00">
                  </div>
                </div>

                <!-- NetMeter Cost -->
                <div class="col-md-4 col-sm-6 col-12">
                  <label class="form-label fs-8 text-secondary mb-1">NetMeter Cost (₹)</label>
                  <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white px-2 text-muted fw-semibold fs-8">₹</span>
                    <input 
                      type="number" 
                      min="0" 
                      step="any"
                      class="form-control fs-8 font-monospace bg-white" 
                      [(ngModel)]="netMeterPayment" 
                      name="custNetMeterPayment" 
                      placeholder="0.00">
                  </div>
                </div>

                <!-- GST (%) & Calculated Amount -->
                <div class="col-md-4 col-sm-6 col-12">
                  <label class="form-label fs-8 text-secondary mb-1">GST (%) &amp; Amount (₹)</label>
                  <div class="input-group input-group-sm">
                    <input 
                      type="number" 
                      min="0" 
                      step="any"
                      class="form-control fs-8 font-monospace bg-white" 
                      [(ngModel)]="gstPercentage" 
                      name="custGstPercentage" 
                      placeholder="18">
                    <span class="input-group-text bg-light text-dark fw-semibold fs-9 px-1.5 font-monospace">
                      ₹{{ gstAmount | number:'1.2-2' }}
                    </span>
                  </div>
                </div>

                <!-- Others Cost -->
                <div class="col-md-4 col-sm-6 col-12">
                  <label class="form-label fs-8 text-secondary mb-1">Others Cost (₹)</label>
                  <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white px-2 text-muted fw-semibold fs-8">₹</span>
                    <input 
                      type="number" 
                      min="0" 
                      step="any"
                      class="form-control fs-8 font-monospace bg-white" 
                      [(ngModel)]="otherCost" 
                      name="custOtherCost" 
                      placeholder="0.00">
                  </div>
                </div>
              </div>

              <!-- Live Formula Breakdown Strip -->
              <div class="mt-3 p-2 rounded-2 bg-light border d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div class="d-flex align-items-center gap-1.5 fs-8 text-secondary">
                  <span class="fw-bold text-dark">Total Set Cost:</span>
                  <span class="font-monospace fw-semibold text-dark">₹{{ totalExpense | number:'1.2-2' }}</span>
                </div>
                <div class="d-flex align-items-center gap-1.5 fs-8">
                  <span class="fw-bold text-dark">Net Profit:</span>
                  <span 
                    class="font-monospace fw-bold"
                    [ngClass]="estimatedProfit >= 0 ? 'text-success' : 'text-danger'">
                    ₹{{ estimatedProfit | number:'1.2-2' }}
                  </span>
                </div>
              </div>

            </div>

          </div>
        </form>
      </div>

      <!-- Modal Footer -->
      <div class="modal-footer bg-white border-top py-2.5 px-3 d-flex justify-content-end align-items-center gap-2">
        <button 
          type="button" 
          class="btn btn-sm btn-outline-secondary px-3 fs-8" 
          [disabled]="isSaving"
          (click)="onClose()">
          Cancel
        </button>
        <button 
          type="button" 
          class="btn btn-sm btn-primary px-4 fs-8 fw-semibold d-inline-flex align-items-center gap-1.5 shadow-sm" 
          [disabled]="isSaving"
          (click)="saveCustomer()">
          <span *ngIf="isSaving" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          <app-icon *ngIf="!isSaving" name="check" [size]="14"></app-icon>
          <span>Update Financials</span>
        </button>
      </div>

    </div>
  </div>
</div>
