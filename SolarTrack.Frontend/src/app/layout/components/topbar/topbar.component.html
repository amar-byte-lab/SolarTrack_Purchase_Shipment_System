<header class="topbar">
  <div class="w-100 d-flex align-items-center justify-content-between gap-2">
    <!-- Menu Toggle & Page Title (Visible on all screens, collapsible sidebar) -->
    <div class="d-flex align-items-center gap-2">
      <button 
        type="button"
        class="btn btn-sm btn-outline-secondary px-2.5 py-1 flex-shrink-0 btn-menu-toggle shadow-none" 
        (click)="navService.toggleSidebar()" 
        title="Toggle Navigation Menu">
        <span>☰</span>
      </button>
      <h1 class="topbar-title">{{ navService.pageTitle() }}</h1>
    </div>
  </div>
</header>
