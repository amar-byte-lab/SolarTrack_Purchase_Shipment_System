<header class="topbar">
  <div class="w-100 d-flex align-items-center justify-content-between gap-3 flex-wrap">
    <!-- Left: Mobile Toggle & Page Title -->
    <div class="d-flex align-items-center gap-2">
      <button 
        class="btn btn-sm btn-outline-secondary px-2 py-1 flex-shrink-0 d-md-none btn-menu-toggle shadow-none" 
        (click)="navService.toggleMobileSidebar()" 
        title="Toggle Menu">
        <span>☰</span>
        <span class="d-none d-sm-inline ms-1 fw-semibold">Menu</span>
      </button>
      <h1 class="topbar-title">{{ navService.pageTitle() }}</h1>
    </div>

    <!-- Right: User Account Controls -->
    <div class="topbar-actions d-flex align-items-center gap-2 flex-wrap justify-content-end ms-auto">
      @if (authService.currentUser(); as user) {
        <div class="d-none d-md-flex align-items-center gap-2 user-badge">
          <span>
            <strong class="text-dark fw-semibold">{{ user.username || user.userid }}</strong>
            <span class="text-muted ms-1">({{ user.role }})</span>
          </span>
          <button 
            class="btn btn-sm btn-outline-secondary btn-logout-subtle d-inline-flex align-items-center gap-1 py-1 px-2.5 bg-white shadow-none" 
            (click)="onLogout()" 
            title="Logout">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="1.75"/>
              <polyline points="16 17 21 12 16 7" stroke="currentColor" stroke-width="1.75"/>
              <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="1.75"/>
            </svg>
            <span>Logout</span>
          </button>
        </div>
      }
    </div>
  </div>
</header>
