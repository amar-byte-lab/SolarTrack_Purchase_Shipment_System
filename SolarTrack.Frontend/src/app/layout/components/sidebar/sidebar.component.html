<aside id="sidebar" [class.open]="navService.isMobileSidebarOpen()">
  <!-- Brand Header -->
  <div class="brand">
    <div class="d-flex align-items-center gap-2 overflow-hidden" title="Shri Trutiyadev Solar Enterprises">
      <img src="assets/sampleFiles/LogoWithoutLetter.png" alt="Logo" class="sidebar-brand-icon">
      <div class="brand-text-wrapper">
        <span class="brand-title-line1">Shri Trutiyadev</span>
        <span class="brand-title-line2">Solar Enterprises</span>
      </div>
    </div>
    <button 
      class="btn text-secondary p-0 d-md-none border-0 fs-5 flex-shrink-0" 
      (click)="navService.closeMobileSidebar()" 
      title="Close Menu" 
      style="line-height: 1; opacity: 0.85; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;">
      ✕
    </button>
  </div>

  <!-- Navigation Links -->
  <nav class="nav flex-column sidebar-nav">
    @for (item of visibleNavItems(); track item.path) {
      <a 
        class="nav-link" 
        [routerLink]="item.path" 
        routerLinkActive="active" 
        (click)="onLinkClick()">
        <app-icon [name]="item.icon" [size]="18" [strokeWidth]="1.75"></app-icon>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- User Information & Logout (Pinned to bottom of nav panel on Desktop & Mobile) -->
  @if (authService.currentUser(); as user) {
    <div class="sidebar-footer">
      <div class="sidebar-user-badge">
        <div class="user-info text-truncate">
          <strong class="user-name text-truncate">{{ user.username || user.userid }}</strong>
          <span class="user-role">({{ user.role }})</span>
        </div>
        <button 
          type="button"
          class="btn btn-sm btn-logout-sidebar d-inline-flex align-items-center gap-1 shadow-none flex-shrink-0" 
          (click)="onLogout()" 
          title="Logout">
          <app-icon name="logout" [size]="13" [strokeWidth]="1.75"></app-icon>
          <span>Logout</span>
        </button>
      </div>
    </div>
  }
</aside>
