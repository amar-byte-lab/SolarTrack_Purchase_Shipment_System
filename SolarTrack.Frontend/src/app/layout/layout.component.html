<div class="app-shell">
  <!-- Sidebar Backdrop (Active whenever sidebar is open on Desktop or Mobile) -->
  <div 
    class="sidebar-backdrop no-print" 
    [class.show]="navService.isSidebarOpen()" 
    (click)="navService.closeSidebar()">
  </div>

  <!-- Left Sidebar Navigation -->
  <app-sidebar class="no-print"></app-sidebar>

  <!-- Right / Main Content Layout -->
  <div class="main-content">
    <!-- Topbar (Visible ONLY when navigation panel is collapsed) -->
    @if (!navService.isSidebarOpen()) {
      <app-topbar class="no-print"></app-topbar>
    }

    <main class="page-body">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
