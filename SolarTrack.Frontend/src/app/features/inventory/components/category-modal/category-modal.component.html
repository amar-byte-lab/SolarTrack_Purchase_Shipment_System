<div *ngIf="isOpen" class="modal-backdrop fade show" (click)="onClose()"></div>

<div *ngIf="isOpen" class="modal d-block" tabindex="-1" role="dialog" aria-modal="true" (click)="onBackdropClick($event)">
  <div class="modal-dialog modal-dialog-centered" style="max-width: 440px;">
    <div class="modal-content border-0 shadow rounded-3 overflow-hidden" (click)="$event.stopPropagation()">
      
      <!-- Modal Header -->
      <div class="modal-header py-2.5 px-3 border-bottom bg-light d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2">
          <div class="cat-icon-badge">
            <app-icon name="folder" [size]="16" class="text-primary"></app-icon>
          </div>
          <div>
            <h6 class="modal-title fw-bold text-dark m-0 fs-7">Equipment Categories</h6>
            <div class="text-secondary fs-9">Add, rename, or delete catalog groups</div>
          </div>
        </div>
        <button type="button" class="btn-close fs-9" aria-label="Close" (click)="onClose()"></button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body p-3 bg-white">
        
        <!-- Add Category Form -->
        <div class="p-2.5 rounded border bg-light mb-3">
          <label class="form-label small fw-semibold text-dark mb-1.5 d-flex align-items-center gap-1.5">
            <app-icon name="plus" [size]="13"></app-icon>
            <span>Add New Category</span>
          </label>
          <div class="input-group input-group-sm">
            <input 
              type="text" 
              class="form-control fs-8" 
              [(ngModel)]="newCategoryName" 
              placeholder="Enter category name..." 
              (keydown.enter)="addCategory()">
            <button class="btn btn-primary fw-semibold px-3 fs-8" type="button" (click)="addCategory()">
              + Add
            </button>
          </div>
        </div>

        <!-- Categories List -->
        <div class="d-flex align-items-center justify-content-between mb-2 px-1">
          <span class="small fw-semibold text-secondary text-uppercase fs-9" style="letter-spacing: 0.04em;">
            Active Categories
          </span>
          <span class="badge bg-light text-secondary border font-monospace fs-9">
            {{ categories.length }} Categories
          </span>
        </div>

        <div class="cat-list-wrap border rounded p-1 bg-white" style="max-height: 250px; overflow-y: auto;">
          <div 
            *ngFor="let cat of categories" 
            class="cat-row d-flex align-items-center justify-content-between p-2 border-bottom last-border-0">
            
            <div class="d-flex align-items-center gap-2">
              <span class="cat-dot"></span>
              <span *ngIf="editingCategory !== cat" class="fw-semibold text-dark fs-8">{{ cat }}</span>
              <input 
                *ngIf="editingCategory === cat" 
                type="text" 
                class="form-control form-control-sm fs-8 py-0 px-1" 
                [(ngModel)]="renamedCategoryValue" 
                (keydown.enter)="saveRename(cat)"
                (keydown.escape)="cancelRename()">
            </div>

            <div class="d-flex align-items-center gap-1">
              <!-- Edit button / Save button -->
              <button 
                *ngIf="editingCategory !== cat" 
                type="button" 
                class="btn btn-xs btn-outline-secondary p-1 border-0" 
                (click)="startRename(cat)" 
                title="Rename Category">
                <app-icon name="edit" [size]="12"></app-icon>
              </button>
              <button 
                *ngIf="editingCategory === cat" 
                type="button" 
                class="btn btn-xs btn-success text-white p-1" 
                (click)="saveRename(cat)" 
                title="Save Name">
                <app-icon name="check" [size]="12"></app-icon>
              </button>
              <button 
                *ngIf="editingCategory === cat" 
                type="button" 
                class="btn btn-xs btn-outline-secondary p-1 ms-1" 
                (click)="cancelRename()" 
                title="Cancel">
                <app-icon name="close" [size]="12"></app-icon>
              </button>

              <!-- Delete Button -->
              <button 
                *ngIf="editingCategory !== cat && cat !== 'Others'" 
                type="button" 
                class="btn btn-xs btn-outline-danger p-1 border-0" 
                (click)="deleteCategory(cat)" 
                title="Delete Category">
                <app-icon name="trash" [size]="12"></app-icon>
              </button>
            </div>

          </div>
        </div>

      </div>

      <!-- Modal Footer -->
      <div class="modal-footer py-2 px-3 border-top bg-light">
        <button type="button" class="btn btn-sm btn-secondary w-100 fw-semibold fs-8" (click)="onClose()">
          Close
        </button>
      </div>

    </div>
  </div>
</div>
