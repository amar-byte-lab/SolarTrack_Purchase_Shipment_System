<div class="modal-backdrop" (click)="close.emit()">
  <div class="modal-dialog modal-dialog-centered modal-lg" (click)="$event.stopPropagation()">
    <div class="modal-content border-0 shadow">
      
      <!-- Header -->
      <div class="modal-header py-2.5 px-3 border-bottom bg-light d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
          <app-icon name="boxes" class="text-primary"></app-icon>
          <div>
            <h6 class="modal-title fw-bold text-dark m-0">Inventory &amp; Logistics Summary</h6>
            <div class="text-secondary small mt-0.5" style="font-size:0.75rem;">
              Real-time EPC Warehouse, Project Orders &amp; Site Dispatch Metrics
            </div>
          </div>
        </div>
        <button type="button" class="btn-close" (click)="close.emit()" aria-label="Close"></button>
      </div>

      <!-- Body -->
      <div class="modal-body p-3">
        <app-inventory-summary [kpis]="kpis" [showHeader]="false"></app-inventory-summary>
      </div>

      <!-- Footer -->
      <div class="modal-footer py-2 px-3 border-top bg-light">
        <button type="button" class="btn btn-sm btn-secondary px-3" (click)="close.emit()">Close</button>
      </div>

    </div>
  </div>
</div>
