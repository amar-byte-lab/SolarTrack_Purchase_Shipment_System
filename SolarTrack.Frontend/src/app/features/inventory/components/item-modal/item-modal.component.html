<div *ngIf="isOpen" class="modal-backdrop fade show" (click)="onClose()"></div>

<div *ngIf="isOpen" class="modal d-block" tabindex="-1" role="dialog" aria-modal="true" (click)="onBackdropClick($event)">
  <div class="modal-dialog modal-dialog-centered" style="max-width: 480px;">
    <div class="modal-content border-0 shadow rounded-3 overflow-hidden" (click)="$event.stopPropagation()">
      
      <!-- Modal Header -->
      <div class="modal-header py-2.5 px-3 border-bottom bg-light d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2">
          <app-icon name="boxes" [size]="16" class="text-primary"></app-icon>
          <h6 class="modal-title fw-bold text-dark m-0 fs-7">
            {{ isEditMode ? 'Edit Equipment Item' : 'Add New Equipment Item' }}
          </h6>
        </div>
        <button type="button" class="btn-close fs-9" aria-label="Close" (click)="onClose()"></button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body p-3 bg-white">
        <div class="row g-2">
          
          <!-- Category -->
          <div class="col-sm-6 col-12">
            <label class="form-label small fw-semibold text-secondary mb-1">Category *</label>
            <select class="form-select form-select-sm fs-8" [(ngModel)]="category">
              <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
            </select>
          </div>

          <!-- SKU / Item Code -->
          <div class="col-sm-6 col-12">
            <label class="form-label small fw-semibold text-secondary mb-1">Item Code / SKU *</label>
            <input 
              type="text" 
              class="form-control form-control-sm font-monospace fs-8" 
              [(ngModel)]="itemCode" 
              [disabled]="isEditMode"
              placeholder="e.g. SKU-PV-540W">
          </div>

          <!-- Item Name -->
          <div class="col-12">
            <label class="form-label small fw-semibold text-secondary mb-1">Equipment Item Name *</label>
            <input 
              type="text" 
              class="form-control form-control-sm fs-8 fw-semibold text-dark" 
              [(ngModel)]="itemName" 
              placeholder="e.g. Solar PV Module 540W Mono PERC">
          </div>

          <!-- Unit of Measurement -->
          <div class="col-sm-4 col-6">
            <label class="form-label small fw-semibold text-secondary mb-1">Unit</label>
            <select class="form-select form-select-sm fs-8" [(ngModel)]="unit">
              <option value="Nos">Nos</option>
              <option value="Meters">Meters</option>
              <option value="Sets">Sets</option>
              <option value="Pcs">Pcs</option>
              <option value="Bag">Bag</option>
              <option value="Kgs">Kgs</option>
            </select>
          </div>

          <!-- Min Threshold Alert -->
          <div class="col-sm-4 col-6">
            <label class="form-label small fw-semibold text-secondary mb-1">Min Alert Qty</label>
            <input 
              type="number" 
              min="0" 
              step="1" 
              class="form-control form-control-sm text-center font-monospace fs-8" 
              [(ngModel)]="minThreshold">
          </div>

          <!-- Estimated Buying Price -->
          <div class="col-sm-4 col-12">
            <label class="form-label small fw-semibold text-secondary mb-1">Cost / Unit (₹)</label>
            <input 
              type="number" 
              min="0" 
              step="any" 
              class="form-control form-control-sm text-end font-monospace fs-8 fw-semibold text-dark" 
              [(ngModel)]="buyingPrice"
              placeholder="0.00">
          </div>

          <!-- Godown Location -->
          <div class="col-12">
            <label class="form-label small fw-semibold text-secondary mb-1">Godown Storage Location</label>
            <input 
              type="text" 
              class="form-control form-control-sm fs-8" 
              [(ngModel)]="location" 
              placeholder="e.g. Main Godown, Rack A-2">
          </div>

        </div>
      </div>

      <!-- Modal Footer -->
      <div class="modal-footer py-2 px-3 border-top bg-light d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-sm btn-secondary px-3 fs-8" (click)="onClose()">Cancel</button>
        <button type="button" class="btn btn-sm btn-primary px-4 fw-semibold fs-8" (click)="saveItem()">
          {{ isEditMode ? 'Update Item' : 'Save Item' }}
        </button>
      </div>

    </div>
  </div>
</div>
