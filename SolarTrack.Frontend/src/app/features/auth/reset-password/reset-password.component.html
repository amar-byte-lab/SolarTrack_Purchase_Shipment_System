<div class="auth-container">
  <div class="reset-card">
    <!-- Header / Brand -->
    <div class="brand-logo">
      <img src="assets/sampleFiles/CompanyLogo.jpeg" alt="Shri Trutiyadev Solar Enterprises Logo" class="brand-company-logo">
    </div>

    <h5 class="fw-bold text-center text-dark mb-1">Reset Password</h5>
    <p class="text-muted text-center fs-8 mb-4">Enter a new secure password for your account</p>

    <!-- Error Alert -->
    @if (errorMessage()) {
      <div class="alert alert-danger py-2 px-3 fs-8 mb-3 d-flex align-items-center" role="alert">
        <svg class="bi flex-shrink-0 me-2" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M7.938 2.016a.13.13 0 0 1 .125 0l6.857 11.656c.028.05.028.11 0 .16-.028.05-.08.08-.137.08H1.217a.16.16 0 0 1-.137-.08.18.18 0 0 1 0-.16L7.938 2.016zm.062 4.484a.5.5 0 0 0-.5.5v3a.5.5 0 0 0 1 0v-3a.5.5 0 0 0-.5-.5zm0 5a.5.5 0 1 0 0 1 .5.5 0 0 0 0-1z"/>
        </svg>
        <div>{{ errorMessage() }}</div>
      </div>
    }

    <!-- Success Alert -->
    @if (successMessage()) {
      <div class="alert alert-success py-2 px-3 fs-8 mb-3 d-flex align-items-center" role="alert">
        <svg class="bi flex-shrink-0 me-2" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
        </svg>
        <div>{{ successMessage() }}</div>
      </div>
    }

    <!-- Reset Form -->
    @if (hasValidToken() && !isCompleted()) {
      <form (ngSubmit)="onResetSubmit()" autocomplete="off">
        <div class="mb-3 text-start">
          <label for="txtNewPassword" class="form-label fs-8 fw-semibold text-secondary">New Password</label>
          <div class="position-relative">
            <input 
              [type]="showPassword() ? 'text' : 'password'" 
              class="form-control form-control-lg fs-7 pe-5" 
              id="txtNewPassword" 
              [(ngModel)]="newPassword" 
              name="newPassword" 
              placeholder="Enter New Password" 
              required 
              autofocus>
            <button 
              type="button" 
              class="btn border-0 position-absolute end-0 top-50 translate-middle-y px-3 text-secondary toggle-password-btn" 
              (click)="togglePassword()" 
              tabindex="-1" 
              [title]="showPassword() ? 'Hide Password' : 'Show Password'" 
              style="background: transparent; z-index: 5;">
              @if (showPassword()) {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              } @else {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              }
            </button>
          </div>
        </div>

        <div class="mb-4 text-start">
          <label for="txtConfirmPassword" class="form-label fs-8 fw-semibold text-secondary">Confirm Password</label>
          <div class="position-relative">
            <input 
              [type]="showConfirmPassword() ? 'text' : 'password'" 
              class="form-control form-control-lg fs-7 pe-5" 
              id="txtConfirmPassword" 
              [(ngModel)]="confirmPassword" 
              name="confirmPassword" 
              placeholder="Re-enter New Password" 
              required>
            <button 
              type="button" 
              class="btn border-0 position-absolute end-0 top-50 translate-middle-y px-3 text-secondary toggle-password-btn" 
              (click)="toggleConfirmPassword()" 
              tabindex="-1" 
              [title]="showConfirmPassword() ? 'Hide Password' : 'Show Password'" 
              style="background: transparent; z-index: 5;">
              @if (showConfirmPassword()) {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              } @else {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              }
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-reset fs-7 mb-3" [disabled]="isLoading()">
          @if (isLoading()) {
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            <span>Updating...</span>
          } @else {
            <span>Update Password</span>
          }
        </button>
      </form>
    }

    <div class="text-center mt-3">
      <a routerLink="/login" class="fs-8 text-decoration-none fw-semibold text-primary">Back to Sign In</a>
    </div>
  </div>
</div>
