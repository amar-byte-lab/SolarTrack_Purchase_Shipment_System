<div *ngIf="isOpen" class="modal-backdrop fade show"></div>

<div *ngIf="isOpen" class="modal d-block" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content border-0 shadow">
      
      <!-- Header -->
      <div class="modal-header py-2.5 px-3 border-bottom bg-white d-flex align-items-center justify-content-between">
        <div>
          <h6 class="modal-title fw-bold text-dark mb-0 fs-7">Technical Specifications &amp; RTS Record</h6>
          <div class="text-secondary fs-8">Consumer: <strong>{{ customer?.Name }}</strong> ({{ customer?.ConsumerNo }})</div>
        </div>
        <button type="button" class="btn-close" (click)="onClose()"></button>
      </div>

      <!-- Modal Body Content: Reusable Technical Specs Accordion -->
      <div class="modal-body p-3">
        <app-technical-specs-accordion
          [specs]="tempSpecs"
          [customer]="customer"
          [showActions]="false">
        </app-technical-specs-accordion>
      </div>

      <!-- Footer -->
      <div class="modal-footer bg-light py-2 px-3 d-flex justify-content-between align-items-center">
        <span class="text-muted fs-9">Changes auto-sync to customer database record</span>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-outline-secondary btn-sm px-3" (click)="onClose()">Cancel</button>
          <button type="button" class="btn btn-primary btn-sm px-3.5 fw-semibold" (click)="onSave()">Save Specifications</button>
        </div>
      </div>

    </div>
  </div>
</div>
