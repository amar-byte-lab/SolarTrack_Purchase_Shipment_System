<div class="technical-specs-accordion">

  <div class="accordion-list">

    <!-- ════════════════════════════════════════════════════════════════════ -->
    <!-- 1. SITE                                                              -->
    <!-- ════════════════════════════════════════════════════════════════════ -->
    <div class="accordion-item" [class.is-open]="isSectionOpen('site')">
      <div class="accordion-header" (click)="toggleSection('site')">
        <div class="header-left">
          <app-icon name="map-pin" [size]="15" class="header-icon text-primary"></app-icon>
          <span class="header-title">Site</span>
        </div>
        <div class="header-right">
          <span class="chevron-arrow" [class.rotated]="isSectionOpen('site')">
            <app-icon name="chevron-down" [size]="14"></app-icon>
          </span>
        </div>
      </div>

      <div class="accordion-body" *ngIf="isSectionOpen('site')">
        <div class="row g-2.5 align-items-stretch">
          
          <!-- Column 1: DATE OF INSTALLATION (Row 1), STATE and DISTRICT in one row (Row 2) -->
          <div class="col-md-4 col-lg-3 d-flex flex-column gap-2">
            <div>
              <label class="specs-label highlighted-label">DATE OF INSTALLATION</label>
              <input 
                type="date" 
                class="form-control form-control-sm highlighted-input" 
                [(ngModel)]="specs.dateOfInstallation" 
                (ngModelChange)="emitChange()"
                [disabled]="readOnly">
            </div>
            <div class="row g-2">
              <div class="col-6">
                <label class="specs-label">STATE</label>
                <input 
                  type="text" 
                  class="form-control form-control-sm text-uppercase" 
                  [(ngModel)]="specs.state" 
                  (ngModelChange)="emitChange()"
                  placeholder="ODISHA"
                  [disabled]="readOnly">
              </div>
              <div class="col-6">
                <label class="specs-label">DISTRICT</label>
                <input 
                  type="text" 
                  class="form-control form-control-sm text-uppercase" 
                  [(ngModel)]="specs.district" 
                  (ngModelChange)="emitChange()"
                  placeholder="CUTTACK"
                  [disabled]="readOnly">
              </div>
            </div>
          </div>

          <!-- Column 2: TYPE OF CONNECTION, PIN CODE in one column -->
          <div class="col-md-4 col-lg-3 d-flex flex-column gap-2">
            <div>
              <label class="specs-label">TYPE OF CONNECTION</label>
              <select 
                class="form-select form-select-sm" 
                [(ngModel)]="specs.connectionType" 
                (ngModelChange)="emitChange()"
                [disabled]="readOnly">
                <option value="1ph LT">1PH LT</option>
                <option value="3ph LT">3PH LT</option>
                <option value="3ph HT">3PH HT</option>
              </select>
            </div>
            <div>
              <label class="specs-label highlighted-label">PIN CODE</label>
              <input 
                type="text" 
                class="form-control form-control-sm font-monospace text-uppercase highlighted-input" 
                [(ngModel)]="specs.pinCode" 
                (ngModelChange)="emitChange()"
                placeholder="E.G. 756001"
                maxlength="6"
                [disabled]="readOnly">
            </div>
          </div>

          <!-- Column 3: Address / Location (Full height textarea) -->
          <div class="col-md-4 col-lg-6 d-flex flex-column">
            <label class="specs-label highlighted-label">ADDRESS / LOCATION</label>
            <textarea 
              class="form-control form-control-sm font-monospace text-uppercase highlighted-input flex-grow-1 site-address-textarea" 
              [(ngModel)]="specs.address" 
              (ngModelChange)="emitChange()"
              placeholder="VILLAGE / LOCALITY / SITE ADDRESS..."
              autocomplete="off"
              [disabled]="readOnly"></textarea>
          </div>

        </div>

        <!-- Section Action Buttons: Reset and Save -->
        <div class="d-flex justify-content-end align-items-center gap-2 mt-3 pt-2 border-top">
          <button 
            type="button" 
            class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1"
            (click)="onReset()">
            <app-icon name="refresh" [size]="12"></app-icon>
            <span>Reset</span>
          </button>
          <button 
            type="button" 
            class="btn btn-sm btn-primary d-flex align-items-center gap-1 fw-semibold"
            (click)="onSave()">
            <app-icon name="check" [size]="13"></app-icon>
            <span>Save</span>
          </button>
        </div>
      </div>
    </div>


    <!-- ════════════════════════════════════════════════════════════════════ -->
    <!-- 2. INVERTER                                                          -->
    <!-- ════════════════════════════════════════════════════════════════════ -->
    <div class="accordion-item" [class.is-open]="isSectionOpen('inverter')">
      <div class="accordion-header" (click)="toggleSection('inverter')">
        <div class="header-left">
          <app-icon name="zap" [size]="15" class="header-icon text-primary"></app-icon>
          <span class="header-title">Inverter</span>
        </div>
        <div class="header-right">
          <span class="chevron-arrow" [class.rotated]="isSectionOpen('inverter')">
            <app-icon name="chevron-down" [size]="14"></app-icon>
          </span>
        </div>
      </div>

      <div class="accordion-body" *ngIf="isSectionOpen('inverter')">
        <div class="row g-3">
          
          <!-- Col-1: INVERTER MAKE (Row 1), INVERTER TYPE & INVERTER COUNT (Row 2) -->
          <div class="col-md-6 d-flex flex-column gap-2">
            <div>
              <label class="specs-label highlighted-label">INVERTER MAKE</label>
              <input 
                type="text" 
                class="form-control form-control-sm text-uppercase highlighted-input" 
                [(ngModel)]="specs.inverterMake" 
                (ngModelChange)="emitChange()"
                placeholder="e.g. V-GUARD"
                [disabled]="readOnly">
            </div>
            <div class="row g-2">
              <div class="col-7">
                <label class="specs-label">INVERTER TYPE</label>
                <select 
                  class="form-select form-select-sm" 
                  [(ngModel)]="specs.inverterName" 
                  (ngModelChange)="emitChange()"
                  [disabled]="readOnly">
                  <option value="GRID-TIED">GRID-TIED</option>
                  <option value="HYBRID">HYBRID</option>
                  <option value="SOLAR PCU">SOLAR PCU</option>
                  <option value="PURE SINE WAVE UPS">PURE SINE WAVE UPS</option>
                </select>
              </div>
              <div class="col-5">
                <label class="specs-label">INVERTER COUNT</label>
                <input 
                  type="number" 
                  min="1" 
                  class="form-control form-control-sm" 
                  [(ngModel)]="specs.inverterCount" 
                  (ngModelChange)="emitChange()"
                  placeholder="1"
                  [disabled]="readOnly">
              </div>
            </div>
          </div>

          <!-- Col-2: SERIAL NO (Row 1), CAPACITY, I/P VOLTAGE, O/P VOLTAGE (Row 2) -->
          <div class="col-md-6 d-flex flex-column gap-2">
            <div>
              <label class="specs-label highlighted-label">INVERTER SERIAL NO.</label>
              <input 
                type="text" 
                class="form-control form-control-sm font-monospace text-uppercase highlighted-input" 
                [(ngModel)]="specs.inverterSerialNo" 
                (ngModelChange)="emitChange()"
                placeholder="e.g. INV202409821"
                [disabled]="readOnly">
            </div>
            <div class="row g-2">
              <div class="col-4">
                <label class="specs-label">CAPACITY (KW)</label>
                <input 
                  type="number" 
                  step="any" 
                  class="form-control form-control-sm" 
                  [(ngModel)]="specs.inverterCapacity" 
                  (ngModelChange)="emitChange()"
                  placeholder="3"
                  [disabled]="readOnly">
              </div>
              <div class="col-4">
                <label class="specs-label">I/P VOLTAGE (V DC)</label>
                <input 
                  type="number" 
                  class="form-control form-control-sm" 
                  [(ngModel)]="specs.inverterInputVoltage" 
                  (ngModelChange)="emitChange()"
                  placeholder="300"
                  [disabled]="readOnly">
              </div>
              <div class="col-4">
                <label class="specs-label">O/P VOLTAGE (V AC)</label>
                <input 
                  type="text" 
                  class="form-control form-control-sm" 
                  [(ngModel)]="specs.inverterOutputVoltage" 
                  (ngModelChange)="emitChange()"
                  placeholder="220 - 240"
                  [disabled]="readOnly">
              </div>
            </div>
          </div>

        </div>

        <!-- Section Action Buttons: Reset and Save -->
        <div class="d-flex justify-content-end align-items-center gap-2 mt-3 pt-2 border-top">
          <button 
            type="button" 
            class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1"
            (click)="onReset()">
            <app-icon name="refresh" [size]="12"></app-icon>
            <span>Reset</span>
          </button>
          <button 
            type="button" 
            class="btn btn-sm btn-primary d-flex align-items-center gap-1 fw-semibold"
            (click)="onSave()">
            <app-icon name="check" [size]="13"></app-icon>
            <span>Save</span>
          </button>
        </div>
      </div>
    </div>


    <!-- ════════════════════════════════════════════════════════════════════ -->
    <!-- 3. PV MODULE                                                         -->
    <!-- ════════════════════════════════════════════════════════════════════ -->
    <div class="accordion-item" [class.is-open]="isSectionOpen('module')">
      <div class="accordion-header" (click)="toggleSection('module')">
        <div class="header-left">
          <app-icon name="sun" [size]="15" class="header-icon text-primary"></app-icon>
          <span class="header-title">PV Module</span>
        </div>
        <div class="header-right">
          <span class="chevron-arrow" [class.rotated]="isSectionOpen('module')">
            <app-icon name="chevron-down" [size]="14"></app-icon>
          </span>
        </div>
      </div>

      <div class="accordion-body" *ngIf="isSectionOpen('module')">
        <div class="row g-3">
          
          <!-- Col-1: MODULE MAKE (Row 1), NO. OF MODULES (Row 2) -->
          <div class="col-md-6 d-flex flex-column gap-2">
            <div>
              <label class="specs-label highlighted-label">MODULE MAKE</label>
              <input 
                type="text" 
                class="form-control form-control-sm text-uppercase highlighted-input" 
                [(ngModel)]="specs.moduleMake" 
                (ngModelChange)="emitChange()"
                placeholder="e.g. LUMINOUS"
                [disabled]="readOnly">
            </div>
            <div>
              <label class="specs-label highlighted-label">NO. OF MODULES</label>
              <input 
                type="number" 
                min="1" 
                max="48" 
                class="form-control form-control-sm highlighted-input" 
                [(ngModel)]="specs.moduleCount" 
                (change)="onModuleCountChange()"
                [disabled]="readOnly">
            </div>
          </div>

          <!-- Col-2: TYPE OF MODULE & MODEL (Row 1), TOTAL CAPACITY (KWP) (Row 2) -->
          <div class="col-md-6 d-flex flex-column gap-2">
            <div>
              <label class="specs-label highlighted-label">TYPE OF MODULE &amp; MODEL</label>
              <input 
                type="text" 
                class="form-control form-control-sm text-uppercase highlighted-input" 
                [(ngModel)]="specs.moduleTypeModel" 
                (ngModelChange)="emitChange()"
                placeholder="e.g. BIFACIAL / TOPCON 545Wp"
                [disabled]="readOnly">
            </div>
            <div>
              <label class="specs-label">TOTAL CAPACITY (KWP)</label>
              <input 
                type="text" 
                class="form-control form-control-sm bg-light fw-bold" 
                [(ngModel)]="specs.moduleTotalCapacity" 
                (ngModelChange)="emitChange()"
                readonly>
            </div>
          </div>

          <!-- Serials List with capacity input beside serial number -->
          <div class="col-12 mt-1">
            <div class="mb-1">
              <span class="fs-8 text-secondary">Module Serials &amp; Capacity</span>
            </div>
            <div class="row g-1.5 font-monospace" style="max-height: 150px; overflow-y: auto;">
              <div *ngFor="let s of specs.moduleSerials" class="col-sm-6 col-md-4">
                <div class="input-group input-group-sm">
                  <span class="input-group-text py-0 px-1.5 fs-9 text-muted">#{{ s.index }}</span>
                  <input 
                    type="text" 
                    class="form-control font-monospace text-uppercase fs-9 py-0.5 px-2" 
                    [(ngModel)]="s.serialNo"
                    (ngModelChange)="emitChange()"
                    placeholder="Serial No"
                    [disabled]="readOnly">
                  <input 
                    type="number" 
                    class="form-control fs-9 py-0.5 px-1.5 text-end" 
                    style="max-width: 70px;"
                    [(ngModel)]="s.capacity"
                    (ngModelChange)="onSerialCapacityChange()"
                    placeholder="545"
                    [disabled]="readOnly">
                  <span class="input-group-text py-0 px-1 fs-9 text-muted">Wp</span>
                </div>
              </div>
            </div>
          </div>

        </div>

        <!-- Section Action Buttons: Reset and Save -->
        <div class="d-flex justify-content-end align-items-center gap-2 mt-3 pt-2 border-top">
          <button 
            type="button" 
            class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1"
            (click)="onReset()">
            <app-icon name="refresh" [size]="12"></app-icon>
            <span>Reset</span>
          </button>
          <button 
            type="button" 
            class="btn btn-sm btn-primary d-flex align-items-center gap-1 fw-semibold"
            (click)="onSave()">
            <app-icon name="check" [size]="13"></app-icon>
            <span>Save</span>
          </button>
        </div>
      </div>
    </div>


    <!-- ════════════════════════════════════════════════════════════════════ -->
    <!-- 4. DCDB & ACDB                                                       -->
    <!-- ════════════════════════════════════════════════════════════════════ -->
    <div class="accordion-item" [class.is-open]="isSectionOpen('dcdbAcdb')">
      <div class="accordion-header" (click)="toggleSection('dcdbAcdb')">
        <div class="header-left">
          <app-icon name="shield" [size]="15" class="header-icon text-primary"></app-icon>
          <span class="header-title">DCDB &amp; ACDB</span>
        </div>
        <div class="header-right">
          <span class="chevron-arrow" [class.rotated]="isSectionOpen('dcdbAcdb')">
            <app-icon name="chevron-down" [size]="14"></app-icon>
          </span>
        </div>
      </div>

      <div class="accordion-body" *ngIf="isSectionOpen('dcdbAcdb')">
        <div class="row g-3">
          
          <!-- DCDB Column -->
          <div class="col-md-6">
            <div class="fs-8 fw-bold text-dark pb-1 mb-2 border-bottom">DC DISTRIBUTION BOX (DCDB)</div>
            <div class="row g-2">
              <div class="col-12">
                <label class="specs-label">DCDB MAKE</label>
                <input 
                  type="text" 
                  class="form-control form-control-sm text-uppercase" 
                  [(ngModel)]="specs.dcdbMake" 
                  (ngModelChange)="emitChange()"
                  placeholder="HAVELLS"
                  [disabled]="readOnly">
              </div>
              <div class="col-6">
                <label class="specs-label">MCB / ISOLATOR (A)</label>
                <input 
                  type="number" 
                  class="form-control form-control-sm" 
                  [(ngModel)]="specs.dcdbMcbDetails" 
                  (ngModelChange)="emitChange()"
                  placeholder="32"
                  [disabled]="readOnly">
              </div>
              <div class="col-6">
                <label class="specs-label">SPD RATING</label>
                <input 
                  type="text" 
                  class="form-control form-control-sm font-monospace" 
                  [(ngModel)]="specs.dcdbSpdRating" 
                  (ngModelChange)="emitChange()"
                  placeholder="600V DC / 20kA"
                  [disabled]="readOnly">
              </div>
              <div class="col-12">
                <label class="specs-label">DCDB SERIAL NO.</label>
                <input 
                  type="text" 
                  class="form-control form-control-sm font-monospace text-uppercase" 
                  [(ngModel)]="specs.dcdbSerialNo" 
                  (ngModelChange)="emitChange()"
                  placeholder="Serial No."
                  [disabled]="readOnly">
              </div>
            </div>
          </div>

          <!-- ACDB Column -->
          <div class="col-md-6">
            <div class="fs-8 fw-bold text-dark pb-1 mb-2 border-bottom">AC DISTRIBUTION BOX (ACDB)</div>
            <div class="row g-2">
              <div class="col-12">
                <label class="specs-label">ACDB MAKE</label>
                <input 
                  type="text" 
                  class="form-control form-control-sm text-uppercase" 
                  [(ngModel)]="specs.acdbMake" 
                  (ngModelChange)="emitChange()"
                  placeholder="HAVELLS"
                  [disabled]="readOnly">
              </div>
              <div class="col-6">
                <label class="specs-label">MCB / MCCB (A)</label>
                <input 
                  type="number" 
                  class="form-control form-control-sm" 
                  [(ngModel)]="specs.acdbMcbDetails" 
                  (ngModelChange)="emitChange()"
                  placeholder="32"
                  [disabled]="readOnly">
              </div>
              <div class="col-6">
                <label class="specs-label">SPD RATING</label>
                <input 
                  type="text" 
                  class="form-control form-control-sm font-monospace" 
                  [(ngModel)]="specs.acdbSpdRating" 
                  (ngModelChange)="emitChange()"
                  placeholder="415V AC / 40kA"
                  [disabled]="readOnly">
              </div>
              <div class="col-12">
                <label class="specs-label">ACDB SERIAL NO.</label>
                <input 
                  type="text" 
                  class="form-control form-control-sm font-monospace text-uppercase" 
                  [(ngModel)]="specs.acdbSerialNo" 
                  (ngModelChange)="emitChange()"
                  placeholder="Serial No."
                  [disabled]="readOnly">
              </div>
            </div>
          </div>

        </div>

        <!-- Section Action Buttons: Reset and Save -->
        <div class="d-flex justify-content-end align-items-center gap-2 mt-3 pt-2 border-top">
          <button 
            type="button" 
            class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1"
            (click)="onReset()">
            <app-icon name="refresh" [size]="12"></app-icon>
            <span>Reset</span>
          </button>
          <button 
            type="button" 
            class="btn btn-sm btn-primary d-flex align-items-center gap-1 fw-semibold"
            (click)="onSave()">
            <app-icon name="check" [size]="13"></app-icon>
            <span>Save</span>
          </button>
        </div>
      </div>
    </div>


    <!-- ════════════════════════════════════════════════════════════════════ -->
    <!-- 5. CABLES & EARTHING                                                 -->
    <!-- ════════════════════════════════════════════════════════════════════ -->
    <div class="accordion-item" [class.is-open]="isSectionOpen('cables')">
      <div class="accordion-header" (click)="toggleSection('cables')">
        <div class="header-left">
          <app-icon name="circuit" [size]="15" class="header-icon text-primary"></app-icon>
          <span class="header-title">Cables &amp; Earthing</span>
        </div>
        <div class="header-right">
          <span class="chevron-arrow" [class.rotated]="isSectionOpen('cables')">
            <app-icon name="chevron-down" [size]="14"></app-icon>
          </span>
        </div>
      </div>

      <div class="accordion-body" *ngIf="isSectionOpen('cables')">
        <div class="row g-2">
          <div class="col-md-6">
            <label class="specs-label">DC CABLE MAKE</label>
            <input 
              type="text" 
              class="form-control form-control-sm text-uppercase" 
              [(ngModel)]="specs.dcCableMake" 
              (ngModelChange)="emitChange()"
              placeholder="e.g. KEI"
              [disabled]="readOnly">
          </div>
          <div class="col-md-6">
            <label class="specs-label">DC CABLE SIZE (SQ MM)</label>
            <input 
              type="number" 
              class="form-control form-control-sm" 
              [(ngModel)]="specs.dcCableSizeType" 
              (ngModelChange)="emitChange()"
              placeholder="4"
              [disabled]="readOnly">
          </div>
          <div class="col-md-4">
            <label class="specs-label">EARTH RESISTANCE (Ω)</label>
            <input 
              type="number" 
              step="0.1" 
              class="form-control form-control-sm" 
              [(ngModel)]="specs.earthResistance" 
              (ngModelChange)="emitChange()"
              placeholder="3.0"
              [disabled]="readOnly">
          </div>
          <div class="col-md-4">
            <label class="specs-label">DC EARTHING (Ω)</label>
            <input 
              type="number" 
              step="0.1" 
              class="form-control form-control-sm" 
              [(ngModel)]="specs.dcEarthing" 
              (ngModelChange)="emitChange()"
              placeholder="1.7"
              [disabled]="readOnly">
          </div>
          <div class="col-md-4">
            <label class="specs-label">AC EARTHING (Ω)</label>
            <input 
              type="number" 
              step="0.1" 
              class="form-control form-control-sm" 
              [(ngModel)]="specs.acEarthing" 
              (ngModelChange)="emitChange()"
              placeholder="2.3"
              [disabled]="readOnly">
          </div>
          <div class="col-md-6">
            <label class="specs-label">EARTH WIRE SIZE (SQ MM)</label>
            <input 
              type="number" 
              class="form-control form-control-sm" 
              [(ngModel)]="specs.earthWireSize" 
              (ngModelChange)="emitChange()"
              placeholder="16"
              [disabled]="readOnly">
          </div>
          <div class="col-md-6">
            <label class="specs-label">LA SIZE &amp; TYPE</label>
            <input 
              type="text" 
              class="form-control form-control-sm text-uppercase" 
              [(ngModel)]="specs.laSizeType" 
              (ngModelChange)="emitChange()"
              placeholder="COPPER BONDED"
              [disabled]="readOnly">
          </div>
        </div>

        <!-- Section Action Buttons: Reset and Save -->
        <div class="d-flex justify-content-end align-items-center gap-2 mt-3 pt-2 border-top">
          <button 
            type="button" 
            class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1"
            (click)="onReset()">
            <app-icon name="refresh" [size]="12"></app-icon>
            <span>Reset</span>
          </button>
          <button 
            type="button" 
            class="btn btn-sm btn-primary d-flex align-items-center gap-1 fw-semibold"
            (click)="onSave()">
            <app-icon name="check" [size]="13"></app-icon>
            <span>Save</span>
          </button>
        </div>
      </div>
    </div>

  </div>

</div>
