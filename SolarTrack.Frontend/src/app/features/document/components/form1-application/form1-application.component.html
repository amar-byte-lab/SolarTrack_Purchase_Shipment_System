<div class="form1-application-container">
  
  <!-- Header Toolbar: Consumer Name Pill & Actions -->
  <div class="doc-tab-toolbar mb-3">
    <div class="doc-consumer-pill">
      <div class="doc-consumer-avatar">
        <app-icon name="customer" [size]="14"></app-icon>
      </div>
      <div class="doc-consumer-meta">
        <span class="doc-consumer-label">Consumer Name</span>
        <span class="doc-consumer-name">{{ customer?.Name || 'No Customer Selected' }}</span>
      </div>
      <button 
        type="button" 
        class="btn btn-outline-primary doc-edit-specs-btn" 
        (click)="editSpecsClicked.emit()" 
        title="Edit Technical Specifications &amp; RTS Record">
        <app-icon name="edit" [size]="12"></app-icon>
        <span>Edit Specs</span>
      </button>
    </div>

    <div class="doc-actions-group">
      <button 
        type="button" 
        class="btn btn-outline-secondary btn-sm" 
        (click)="resetClicked.emit()" 
        title="Reset fields">
        <app-icon name="refresh" [size]="12"></app-icon>
        <span>Reset</span>
      </button>
      <button 
        type="button" 
        class="btn btn-outline-primary btn-sm" 
        (click)="previewClicked.emit()" 
        title="Preview Form 1 document">
        <app-icon name="eye" [size]="12"></app-icon>
        <span>Preview</span>
      </button>
      <button 
        type="button" 
        class="btn btn-primary btn-sm fw-semibold" 
        (click)="previewClicked.emit()" 
        title="Print Form 1">
        <app-icon name="print" [size]="13"></app-icon>
        <span>Print Form 1</span>
      </button>
    </div>
  </div>

  <!-- Section: Designated Authority -->
  <div class="f4-section-card mb-3">
    <div class="f4-section-header">
      <div class="f4-section-title">
        <app-icon name="file" [size]="14" class="text-primary"></app-icon>
        <span>1. Application &amp; Designated Authority</span>
      </div>
      <span class="badge bg-light text-secondary border">DISCOM Office</span>
    </div>
    <div class="p-2 row g-2">
      <div class="col-md-8">
        <label class="f4-label">Designated Officer / DISCOM</label>
        <input type="text" class="form-control f4-input" [value]="'The Designated Officer ' + (customer?.District || 'TPCODL')">
      </div>
      <div class="col-md-4">
        <label class="f4-label">Application Date</label>
        <input type="date" class="form-control f4-input" [value]="customer?.LoginDate || specs.dateOfInstallation">
      </div>
    </div>
  </div>

  <!-- Section: Registered Applicant Details -->
  <div class="f4-section-card mb-3">
    <div class="f4-section-header">
      <div class="f4-section-title">
        <app-icon name="customer" [size]="14" class="text-primary"></app-icon>
        <span>2. Registered Applicant Details</span>
      </div>
      <span class="badge bg-light text-secondary border">Items 1 - 5</span>
    </div>
    <div class="p-2 row g-2">
      <div class="col-md-6">
        <label class="f4-label">Applicant Name</label>
        <input type="text" class="form-control f4-input fw-semibold" [value]="customer?.Name">
      </div>
      <div class="col-md-6">
        <label class="f4-label">Consumer No.</label>
        <input type="text" class="form-control f4-input font-monospace" [value]="customer?.ConsumerNo">
      </div>
      <div class="col-12">
        <label class="f4-label">Premises Address</label>
        <input type="text" class="form-control f4-input" [(ngModel)]="specs.address">
      </div>
      <div class="col-md-4">
        <label class="f4-label">Mobile Number</label>
        <input type="text" class="form-control f4-input font-monospace" [value]="customer?.MobileNumber">
      </div>
      <div class="col-md-4">
        <label class="f4-label">Sanctioned Load (kW)</label>
        <input type="text" class="form-control f4-input" [value]="customer?.ProposedCapacity || '3'">
      </div>
      <div class="col-md-4">
        <label class="f4-label">Tariff Category</label>
        <input type="text" class="form-control f4-input" value="Domestic (LT)">
      </div>
    </div>
  </div>

</div>
