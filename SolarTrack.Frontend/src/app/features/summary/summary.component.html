<div class="summary-page-container">
  <!-- Page Navigation Tabs: Summary & Activity (Fixed Position) -->
  <div class="summary-tabs-sticky-bar">
    <ul class="nav nav-tabs erp-tabs mb-2" role="tablist">
      <li class="nav-item" role="presentation">
        <button 
          class="nav-link fw-semibold fs-8 d-inline-flex align-items-center gap-1.5" 
          [class.active]="activeTab() === 'SUMMARY'"
          type="button" 
          role="tab"
          (click)="setTab('SUMMARY')">
          <app-icon name="summary" [size]="13" [strokeWidth]="2"></app-icon>
          <span>Summary</span>
        </button>
      </li>
      <li class="nav-item" role="presentation" *ngIf="authService.isAdmin()">
        <button 
          class="nav-link fw-semibold fs-8 d-inline-flex align-items-center gap-1.5" 
          [class.active]="activeTab() === 'ACTIVITY'"
          type="button" 
          role="tab"
          (click)="setTab('ACTIVITY')">
          <app-icon name="activity" [size]="13" [strokeWidth]="2"></app-icon>
          <span>Activity</span>
        </button>
      </li>
    </ul>
  </div>

  <!-- Tab Content -->
  <div class="tab-content flex-grow-1 d-flex flex-column min-h-0">
    <!-- TAB 1: Summary -->
    <div *ngIf="activeTab() === 'SUMMARY'" class="tab-pane fade show active flex-grow-1 d-flex flex-column min-h-0">
      <app-summary-toolbar class="flex-shrink-0"></app-summary-toolbar>
      <app-summary-table class="flex-grow-1 d-flex flex-column min-h-0"></app-summary-table>
    </div>

    <!-- TAB 2: Activity -->
    <div *ngIf="activeTab() === 'ACTIVITY' && authService.isAdmin()" class="tab-pane fade show active flex-grow-1 d-flex flex-column min-h-0">
      <app-activity-tab></app-activity-tab>
    </div>
  </div>
</div>
